<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Help Desk - Student</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="back" href="index.html">&larr; Back</a>
<h1>Campus Help Desk</h1>
<p class="subtitle">Report a problem, no login needed.</p>

<div class="card">
  <h2>Submit a problem</h2>
  <label for="studentName">Your name</label>
  <input id="studentName" placeholder="e.g. Alice">
  <label for="problemTitle">Describe your issue</label>
  <input id="problemTitle" placeholder="e.g. Wifi down in building B">
  <button onclick="submitTicket()">Submit</button>
  <p class="ok" id="submitResult"></p>
</div>

<div class="card">
  <h2>Track a ticket</h2>
  <label for="trackId">Ticket number</label>
  <input id="trackId" placeholder="e.g. 4" type="number">
  <button onclick="trackTicket()">Track</button>
</div>

<div class="card" id="ticketBox" hidden>
  <div class="ticket-title" id="ticketTitle"></div>
  <div class="ticket-meta" id="ticketStaff"></div>
  <div id="stepperBox"></div>
  <h2>Live updates</h2>
  <div class="live-log" id="liveLog"></div>
</div>

<script src="stepper.js"></script>
<script>
const TICKET_URL = "http://localhost:8002/tickets";
const WS_URL = "ws://localhost:8003/ws";

const stepper = buildStepper();
document.getElementById("stepperBox").appendChild(stepper);
let socket = null;

async function submitTicket() {
  const name = document.getElementById("studentName").value;
  const title = document.getElementById("problemTitle").value;
  if (!name || !title) return;
  const url = `${TICKET_URL}?name=${encodeURIComponent(name)}&title=${encodeURIComponent(title)}`;
  const ticket = await (await fetch(url, { method: "POST" })).json();
  document.getElementById("submitResult").textContent = `Your ticket number is #${ticket.id} - keep it to track your ticket.`;
  watchTicket(ticket);
}

async function trackTicket() {
  const id = document.getElementById("trackId").value;
  if (!id) return;
  const ticket = await (await fetch(`${TICKET_URL}/${id}`)).json();
  if (ticket.error) {
    alert("No ticket with that number");
    return;
  }
  watchTicket(ticket);
}

function watchTicket(ticket) {
  showTicket(ticket);
  if (socket) socket.close();
  socket = new WebSocket(`${WS_URL}?ticket=${ticket.id}`);
  socket.onmessage = (msg) => {
    const event = JSON.parse(msg.data);
    showTicket(event.ticket);
    const log = document.getElementById("liveLog");
    const line = document.createElement("div");
    line.textContent = `${event.event}: now "${event.ticket.status}"`;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  };
}

function showTicket(ticket) {
  document.getElementById("ticketBox").hidden = false;
  document.getElementById("ticketTitle").textContent = `#${ticket.id} - ${ticket.title}`;
  document.getElementById("ticketStaff").textContent = ticket.staff ? `Assigned to ${ticket.staff}` : "";
  setStepper(stepper, ticket.status);
}
</script>

</body>
</html>
