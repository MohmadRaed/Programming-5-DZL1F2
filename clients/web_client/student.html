<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Help Desk - Student</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    max-width: 640px;
    margin: 40px auto;
    padding: 0 16px 40px;
    min-height: 100vh;
    background: linear-gradient(160deg, #eef2ff 0%, #f5f3ff 45%, #fdf2f8 100%);
    color: #1f2937;
  }
  a.back { color: #4f46e5; text-decoration: none; font-size: 0.85rem; }
  h1 { font-size: 1.6rem; margin-bottom: 4px; }
  .subtitle { color: #6b7280; margin-top: 0; margin-bottom: 24px; }
  .card {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(79,70,229,0.08);
  }
  .card h2 { margin-top: 0; font-size: 1.1rem; }
  label { display: block; font-size: 0.85rem; color: #6b7280; margin: 10px 0 4px; }
  input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 0.95rem;
    background: #fff;
  }
  input:focus { outline: none; border-color: #6366f1; }
  button {
    margin-top: 14px;
    padding: 8px 16px;
    background: #4f46e5;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover { background: #4338ca; }
  button:active { transform: scale(0.97); }
  #submitResult { font-size: 0.9rem; color: #065f46; margin-top: 10px; }
  #ticketBox { display: none; }
  .ticket-header { display: flex; justify-content: space-between; align-items: center; }
  .ticket-title { font-weight: 600; }
  .assigned-to { color: #6b7280; font-size: 0.85rem; margin-top: 4px; }

  .stepper {
    display: flex;
    align-items: flex-start;
    margin: 28px 0 20px;
  }
  .step {
    flex: 1;
    text-align: center;
    position: relative;
  }
  .step-line {
    position: absolute;
    top: 15px;
    left: -50%;
    width: 100%;
    height: 4px;
    background: #e5e7eb;
    z-index: 0;
  }
  .step:first-child .step-line { display: none; }
  .step-line-fill {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #6366f1, #a855f7);
    transition: width 0.6s ease;
  }
  .step-dot {
    position: relative;
    z-index: 1;
    width: 32px;
    height: 32px;
    margin: 0 auto 8px;
    border-radius: 50%;
    background: #e5e7eb;
    color: #9ca3af;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 700;
    transition: background 0.4s, color 0.4s, box-shadow 0.4s;
  }
  .step-label {
    font-size: 0.75rem;
    color: #9ca3af;
    text-transform: capitalize;
    transition: color 0.4s;
  }
  .step.done .step-dot {
    background: linear-gradient(135deg, #6366f1, #a855f7);
    color: #fff;
  }
  .step.done .step-label { color: #4338ca; font-weight: 600; }
  .step.current .step-dot {
    background: linear-gradient(135deg, #6366f1, #a855f7);
    color: #fff;
    animation: pulse 1.6s infinite;
  }
  .step.current .step-label { color: #4338ca; font-weight: 700; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(99,102,241,0.5); }
    70%  { box-shadow: 0 0 0 10px rgba(99,102,241,0); }
    100% { box-shadow: 0 0 0 0 rgba(99,102,241,0); }
  }

  #liveLog {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    padding: 8px 10px;
    height: 90px;
    overflow-y: auto;
    font-size: 0.8rem;
    color: #4b5563;
    margin-top: 10px;
  }
  #liveLog div { padding: 2px 0; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<a class="back" href="index.html">&larr; Back</a>
<h1>Campus Help Desk</h1>
<p class="subtitle">Report a problem, no login needed.</p>

<div class="card">
  <h2>Submit a problem</h2>
  <label for="studentName">Your name</label>
  <input id="studentName" placeholder="e.g. Alice">
  <label for="problemTitle">Describe your issue</label>
  <input id="problemTitle" placeholder="e.g. Wifi down in building B">
  <button onclick="submitTicket()">Submit</button>
  <p id="submitResult"></p>
</div>

<div class="card">
  <h2>Track a ticket</h2>
  <label for="trackId">Ticket number</label>
  <input id="trackId" placeholder="e.g. 4" type="number">
  <button onclick="trackTicket(document.getElementById('trackId').value)">Track</button>
</div>

<div class="card" id="ticketBox">
  <div class="ticket-header">
    <span class="ticket-title" id="ticketTitle"></span>
  </div>
  <div class="assigned-to" id="ticketStaff"></div>

  <div class="stepper" id="stepper">
    <div class="step" data-status="open">
      <div class="step-line"><div class="step-line-fill"></div></div>
      <div class="step-dot">1</div>
      <div class="step-label">Open</div>
    </div>
    <div class="step" data-status="assigned">
      <div class="step-line"><div class="step-line-fill"></div></div>
      <div class="step-dot">2</div>
      <div class="step-label">Assigned</div>
    </div>
    <div class="step" data-status="in_progress">
      <div class="step-line"><div class="step-line-fill"></div></div>
      <div class="step-dot">3</div>
      <div class="step-label">In progress</div>
    </div>
    <div class="step" data-status="done">
      <div class="step-line"><div class="step-line-fill"></div></div>
      <div class="step-dot">4</div>
      <div class="step-label">Done</div>
    </div>
  </div>

  <h2 style="margin-top:16px;">Live updates</h2>
  <div id="liveLog"></div>
</div>

<script>
const TICKET_URL = "http://localhost:8002/tickets";
const WS_HOST = "ws://localhost:8003/ws";
const STATUSES = ["open", "assigned", "in_progress", "done"];

let socket = null;

async function submitTicket() {
  const name = document.getElementById("studentName").value;
  const title = document.getElementById("problemTitle").value;
  if (!name || !title) return;
  const url = `${TICKET_URL}?name=${encodeURIComponent(name)}&title=${encodeURIComponent(title)}`;
  const res = await fetch(url, { method: "POST" });
  const ticket = await res.json();
  document.getElementById("submitResult").textContent = `Your ticket number is #${ticket.id} - keep it to track your ticket.`;
  trackTicket(ticket.id);
}

async function trackTicket(id) {
  if (!id) return;
  const res = await fetch(`${TICKET_URL}/${id}`);
  const ticket = await res.json();
  if (ticket.error) {
    alert("No ticket with that number");
    return;
  }
  showTicket(ticket);
  connectWebSocket(ticket.id);
}

function showTicket(ticket) {
  document.getElementById("ticketBox").style.display = "block";
  document.getElementById("ticketTitle").textContent = `#${ticket.id} - ${ticket.title}`;
  document.getElementById("ticketStaff").textContent = ticket.staff ? `Assigned to ${ticket.staff}` : "";
  renderStepper(ticket.status);
}

function renderStepper(status) {
  const currentIndex = STATUSES.indexOf(status);
  document.querySelectorAll("#stepper .step").forEach((el, i) => {
    el.classList.remove("done", "current");
    if (i < currentIndex) el.classList.add("done");
    if (i === currentIndex) el.classList.add("current");

    const fill = el.querySelector(".step-line-fill");
    if (fill) fill.style.width = i <= currentIndex ? "100%" : "0%";
  });
}

function connectWebSocket(ticketId) {
  if (socket) socket.close();
  socket = new WebSocket(`${WS_HOST}?ticket=${ticketId}`);
  socket.onmessage = (msg) => {
    const event = JSON.parse(msg.data);
    showTicket(event.ticket);
    const log = document.getElementById("liveLog");
    const line = document.createElement("div");
    line.textContent = `${event.event}: now "${event.ticket.status}"`;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  };
}
</script>

</body>
</html>
