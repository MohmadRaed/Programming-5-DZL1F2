<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Help Desk</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    max-width: 480px;
    margin: 80px auto;
    padding: 0 16px;
    background: #f4f6f8;
    color: #1f2937;
    text-align: center;
  }
  h1 { font-size: 1.8rem; margin-bottom: 8px; }
  .subtitle { color: #6b7280; margin-bottom: 32px; }
  .choices { display: flex; gap: 16px; justify-content: center; }
  .choice {
    flex: 1;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 28px 16px;
    text-decoration: none;
    color: #1f2937;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .choice:hover { border-color: #4f46e5; }
  .choice .icon { font-size: 2rem; }
  .choice h2 { font-size: 1.05rem; margin: 10px 0 4px; }
  .choice p { font-size: 0.85rem; color: #6b7280; margin: 0; }
</style>
</head>
<body>

<h1>Campus Help Desk</h1>
<p class="subtitle">Who are you signing in as?</p>

<div class="choices">
  <a class="choice" href="student.html">
    <div class="icon">🎓</div>
    <h2>Student</h2>
    <p>Report a problem, no login needed</p>
  </a>
  <a class="choice" href="staff.html">
    <div class="icon">🛠️</div>
    <h2>Staff</h2>
    <p>Log in to manage tickets</p>
  </a>
</div>

</body>
</html>
