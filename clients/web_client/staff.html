<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Help Desk - Staff</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="back" href="index.html">&larr; Back</a>
<h1>Campus Help Desk - Staff</h1>
<p class="subtitle" id="pageSubtitle">Log in to manage tickets.</p>

<div class="card" id="loginBox">
  <h2>Quick login (demo)</h2>
  <button onclick="login('carol', 'carol123')">Log in as carol</button>
  <button onclick="login('dave', 'dave123')">Log in as dave</button>
  <p class="error" id="loginError"></p>
</div>

<div id="appBox" hidden>
  <h2>Tickets</h2>
  <div id="ticketList"></div>

  <div class="card">
    <h2>Stats</h2>
    <div id="statsLine"></div>
  </div>

  <div class="card">
    <h2>Live updates</h2>
    <div class="live-log" id="liveLog"></div>
  </div>
</div>

<script src="stepper.js"></script>
<script>
const AUTH_URL = "http://localhost:8001";
const TICKET_URL = "http://localhost:8002/tickets";
const STAFF_URL = "http://localhost:8004";
const STATS_URL = "http://localhost:8005/stats";
const WS_URL = "ws://localhost:8003/ws?role=staff";

let currentUser = null;

async function login(username, password) {
  const res = await fetch(`${AUTH_URL}/login?username=${username}&password=${password}`, { method: "POST" });
  const result = await res.json();
  if (result.error) {
    document.getElementById("loginError").textContent = result.error;
    return;
  }
  currentUser = result;
  document.getElementById("loginBox").hidden = true;
  document.getElementById("appBox").hidden = false;
  document.getElementById("pageSubtitle").textContent = `Logged in as ${currentUser.username} (staff)`;
  loadTickets();
  loadStats();
  connectWebSocket();
}

async function loadTickets() {
  const tickets = await (await fetch(TICKET_URL)).json();
  const list = document.getElementById("ticketList");
  list.innerHTML = "";
  tickets.forEach(t => list.appendChild(ticketCard(t)));
}

function ticketCard(t) {
  const card = document.createElement("div");
  card.className = "card";

  const title = document.createElement("div");
  title.className = "ticket-title";
  title.textContent = `#${t.id} - ${t.title}`;

  const meta = document.createElement("div");
  meta.className = "ticket-meta";
  meta.textContent = `reported by ${t.name}` + (t.staff ? ` - assigned to ${t.staff}` : "");

  const stepper = buildStepper();
  setStepper(stepper, t.status);

  const select = document.createElement("select");
  select.innerHTML = STATUSES.map(s => `<option value="${s}">${s.replace("_", " ")}</option>`).join("");
  select.value = t.status;
  select.onchange = () => fetch(`${TICKET_URL}/${t.id}?status=${select.value}`, { method: "PATCH" });

  const assignButton = document.createElement("button");
  assignButton.textContent = "Assign to me";
  assignButton.onclick = () => fetch(`${STAFF_URL}/assign?ticket_id=${t.id}&staff=${currentUser.username}`, { method: "POST" });

  const actions = document.createElement("div");
  actions.className = "ticket-actions";
  actions.append(select, assignButton);

  card.append(title, meta, stepper, actions);
  return card;
}

async function loadStats() {
  const stats = await (await fetch(STATS_URL)).json();
  const counts = Object.entries(stats.by_status).map(([status, n]) => `${status}: ${n}`);
  document.getElementById("statsLine").textContent = `Total: ${stats.total} - ` + counts.join(", ");
}

function connectWebSocket() {
  const socket = new WebSocket(WS_URL);
  socket.onmessage = (msg) => {
    const event = JSON.parse(msg.data);
    const log = document.getElementById("liveLog");
    const line = document.createElement("div");
    line.textContent = `${event.event}: ticket #${event.ticket.id} is now "${event.ticket.status}"`;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
    loadTickets();
    loadStats();
  };
}
</script>

</body>
</html>
